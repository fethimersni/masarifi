<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصاريفي</title>
<meta name="theme-color" content="#1F57B5"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="مصاريفي">
<style>
:root{--bg:#F3F6FA;--card:#fff;--ink:#10243A;--mute:#5C6F84;--line:#DCE3EC;--ac:#1F57B5;--acx:#fff;--bad:#B93A2B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1622;--card:#14243A;--ink:#E8EEF6;--mute:#93A4B8;--line:#243650;--ac:#6EA2F0;--acx:#0C1622;--bad:#F08A7A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1622;--card:#14243A;--ink:#E8EEF6;--mute:#93A4B8;--line:#243650;--ac:#6EA2F0;--acx:#0C1622;--bad:#F08A7A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 150px}
h1{font-size:20px;font-weight:600;margin:4px 0 14px}
.seg{display:flex;gap:3px;padding:3px;background:var(--line);border-radius:11px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:8px 0;border-radius:8px}
.seg .on{background:var(--card);color:var(--ink);font-weight:500}
.tg{display:flex;align-items:center;gap:8px;margin:12px 0 0;color:var(--mute);font-size:13px}
.tg input{width:18px;height:18px;accent-color:var(--ac)}
.hero{margin:20px 0 14px}
.hero small{display:block;color:var(--mute);font-size:13px}
.big{font-size:44px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.u{font-size:18px;color:var(--mute);margin-inline-start:6px}
.bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;min-width:3px}
.cat{display:flex;align-items:center;gap:10px;width:100%;padding:10px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start}
.cat.on{font-weight:600}
.cat .n{flex:1}
.cat .p{width:40px;text-align:end;color:var(--mute);font-size:12px}
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%}
.day h2{display:flex;justify-content:space-between;margin:24px 2px 6px;font-size:13px;font-weight:500;color:var(--mute)}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px}
.row+.row{border-top:1px solid var(--line)}
.row .n{flex:1;min-width:0;overflow-wrap:anywhere}
.row .a{font-weight:500;font-variant-numeric:tabular-nums}
.row .lg{color:var(--ac);font-weight:600}
.x{border:0;background:none;color:var(--mute);font-size:12px;padding:6px 2px}
.x.ask{color:var(--bad);font-weight:500}
.empty{padding:36px 8px;text-align:center;color:var(--mute)}
.foot{margin:28px 0 0;color:var(--mute);font-size:12px;text-align:center}
.lnk{border:0;background:none;color:var(--ac);padding:6px 8px;font-size:13px}
.add{position:fixed;inset-inline:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;height:52px;border:0;border-radius:26px;background:var(--ac);color:var(--acx);font-size:16px;font-weight:600}
.sheet{position:fixed;inset:0;display:none;align-items:flex-end;background:rgba(0,0,0,.45)}
.sheet.open{display:flex}
.panel{width:100%;max-width:520px;margin:0 auto;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:20px 20px 0 0;max-height:100%;overflow-y:auto}
.panel input{display:block;width:100%;margin-top:10px;padding:12px;font-size:16px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
#amt{font-size:26px;font-weight:600;margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{display:flex;align-items:center;gap:6px;padding:7px 12px;background:none;border:1px solid var(--line);border-radius:999px;font-size:14px}
.chips .on{border-color:var(--ac);background:var(--bg);font-weight:500}
.save{width:100%;height:48px;margin-top:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-weight:600;font-size:16px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:16px;margin:0 auto;max-width:400px;padding:10px 14px;background:var(--ink);color:var(--bg);border-radius:10px;font-size:13px;text-align:center;display:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.hd{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.hd h1{flex:1;margin:0}
.pill{padding:7px 14px;background:var(--card);color:inherit;border:1px solid var(--line);border-radius:999px;font-size:14px}
.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row:active{background:var(--line)}
.dt{width:52px;flex:none;color:var(--mute);font-size:12px}
.det{margin:6px 0 12px}
.sub{font-size:12px;color:var(--mute);margin:4px 2px 6px}
.page{position:fixed;inset:0;display:none;overflow:auto;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.act{display:block;width:100%;padding:14px;margin-top:8px;border:0;border-radius:12px;background:var(--bg);color:inherit;font-size:16px;font-weight:500}
.act.bad{color:var(--bad)}
.mt{text-align:center;color:var(--mute);margin-bottom:6px}
.set label{display:block;margin:18px 0 6px;color:var(--mute);font-size:13px}
.set input{width:100%;padding:12px;font-size:16px;background:var(--card);color:inherit;border:1px solid var(--line);border-radius:10px}
.set .act{background:var(--card)}
.ch{font-size:14px;font-weight:600;margin:22px 0 4px}
.ct,.dn svg{direction:ltr}
.ct{width:100%;height:auto;display:block}
.ct text{fill:var(--mute);font-size:10px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lg{display:grid;gap:6px;font-size:14px}
.lg b{color:var(--mute);font-weight:400;margin-inline-start:4px}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk{margin-bottom:4px;text-align:center;font-size:11px;color:var(--mute)}
.cc{height:46px;border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;cursor:pointer}
.cc span{color:var(--mute)}.cc b{font-size:13px;font-weight:500}
.l1{background:color-mix(in srgb,var(--ac) 8%,transparent)}
.l2{background:color-mix(in srgb,var(--ac) 18%,transparent)}
.l3{background:color-mix(in srgb,var(--ac) 34%,transparent)}
.l4{background:var(--ac);color:var(--acx)}.l4 span{color:var(--acx)}
.td{border:1px solid var(--ac)}
.sel{outline:2px solid var(--ac);outline-offset:1px}
.hd2{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mc div{background:var(--card);border-radius:10px;padding:8px 12px}
.mc small{display:block;color:var(--mute);font-size:12px}
.dh{display:flex;justify-content:space-between;padding:12px 14px;font-weight:500}
.dh+.row{border-top:1px solid var(--line)}
.top{display:flex;gap:10px}
.top input{flex:1;min-width:0;width:auto;margin-top:0}
.ok{flex:none;padding:0 22px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font-weight:600;font-size:16px}
.tu{border:0;background:none;color:inherit;text-decoration:underline;font-weight:600;padding:2px 8px}
.quick{position:fixed;inset-inline:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;overflow-x:auto;padding:8px 16px;background:var(--bg);border-top:1px solid var(--line)}
.quick:empty{display:none}
.quick button{flex:none;display:flex;gap:6px;align-items:center;padding:8px 14px;background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:14px;white-space:nowrap}
.quick b{font-weight:500;color:var(--ac);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1>مصاريفي</h1><button class="pill" data-a="calendar">الروزنامة</button><button class="pill" data-a="charts">الرسوم</button><button class="pill" data-a="settings">الإعدادات</button></div>
  <div class="seg" id="seg"></div>
  <label class="tg"><input type="checkbox" id="sm"> <span id="smt"></span></label>
  <div id="app"></div>
  <p class="foot">اضغط مطولاً على أي مصروف للتعديل أو الحذف<input type="file" id="rf" accept=".json,application/json" hidden><br><span id="note">البيانات محفوظة على هذا الجهاز فقط، فخذ نسخة احتياطية من وقت لآخر</span></p>
</div>
<div class="quick" id="qk"></div>
<button class="add" data-a="open">＋ إضافة مصروف</button>
<div class="page" id="ov"><div class="wrap"><div class="hd"><h1 id="ovt"></h1><button class="pill" data-a="ovx">إغلاق</button></div><div id="ovb"></div></div></div>
<div class="sheet" id="mn" data-a="mclose"><div class="panel" data-a="none"><div class="mt" id="mt"></div><button class="act" data-a="medit">تعديل</button><button class="act bad" data-a="mdel">حذف</button></div></div>
<div class="sheet" id="sh" data-a="close">
  <div class="panel" data-a="none">
    <div class="top"><input id="amt" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="المبلغ بالدينار" aria-label="المبلغ"><button class="ok" data-a="save">حفظ</button></div>
    <div class="chips" id="chips"></div>
    <input id="nm" enterkeyhint="done" autocomplete="off" placeholder="البيان (اختياري)" aria-label="البيان">
    <input id="dt" type="date" aria-label="التاريخ">
    
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const CATS=[["قهوة","#8B5E3C"],["أكل","#3E9B5F"],["نقل","#E0A030"],["سيارة","#4A6FD0"],["البيت","#8E5CC4"],["باراشوك","#D2543F"],["أشخاص","#1FA3A3"],["صدقة","#D9689A"],["أخرى","#8392A3"]];
const CC=Object.fromEntries(CATS);
const DN=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n.toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:3});
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const num=s=>parseFloat(s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[٫,،]/g,"."));
let items=[],range="all",small=false,cat=null,pick="قهوة",ref=null,pending=null,loaded=false;
let sub=null,cmo=0,calSel=null,view=null,bar=null,wipe=false,editId=null,cur=null,menuT=0,lp=null;
let cfg={theme:"auto",big:100,ws:1};try{Object.assign(cfg,JSON.parse(localStorage.getItem("cfg")||"{}"))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem("cfg",JSON.stringify(cfg))}catch(e){}};
const theme=()=>{const r=document.documentElement;if(cfg.theme=="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",cfg.theme)};
const rowH=(x,dt)=>`<div class="row" data-id="${esc(x.id)}">${dt?`<span class="dt">${pd(x.d).getDate()} ${MN[pd(x.d).getMonth()]}</span>`:`<i class="dot" style="background:${CC[x.c]||"#8392A3"}"></i>`}<span class="n">${esc(x.n)}</span><span class="a ${x.a>=cfg.big?"lg":""}">${fmt(x.a)}</span></div>`;

function toast(m,undo){const t=$("#toast");t.textContent=m+" ";if(undo){const b=document.createElement("button");b.className="tu";b.textContent="تراجع";b.onclick=()=>{undo();t.style.display="none"};t.appendChild(b)}t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",undo?5000:2600)}

function render(){
  const t=new Date(),today=iso(t);
  let from="0000-00-00";
  if(range=="week"){const d=new Date(t);d.setDate(d.getDate()-6);from=iso(d)}
  if(range=="month")from=today.slice(0,8)+"01";
  let all=items.filter(x=>x.d>=from);
  if(small)all=all.filter(x=>x.a<cfg.big);
  const tot=all.reduce((s,x)=>s+x.a,0);
  const by={};all.forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  const cats=CATS.map(c=>c[0]).filter(c=>by[c]).sort((a,b)=>by[b]-by[a]);
  if(cat&&!by[cat])cat=null;
  const start=range=="all"?(items.length?items.reduce((m,x)=>x.d<m?x.d:m,today):today):from;
  const days=Math.round((pd(today)-pd(start))/864e5)+1;
  $("#seg").innerHTML=[["week","7 أيام"],["month","هذا الشهر"],["all","الكل"]].map(r=>`<button class="${range==r[0]?"on":""}" data-a="range" data-v="${r[0]}">${r[1]}</button>`).join("");
  let h="";
  if(!loaded){h=`<div class="empty">جارٍ التحميل…</div>`}
  else if(!all.length){h=`<div class="empty">لا توجد مصاريف في هذه الفترة.<br>اضغط «إضافة مصروف» لتسجيل أول مصروف.</div>`}
  else{
    h=`<div class="hero"><small>المجموع</small><span class="big">${fmt(tot)}</span><span class="u">د</span><small>${all.length} عملية · المعدل اليومي ${fmt(tot/days)} د</small></div>`;
    h+=`<div class="bar">${cats.map(c=>`<i style="flex:${by[c]};background:${CC[c]}"></i>`).join("")}</div>`;
    h+=cats.map(c=>{const L=all.filter(x=>x.c==c).sort((p,q)=>p.d<q.d?1:-1);return `<button class="cat ${cat==c?"on":""}" data-a="cat" data-v="${c}" aria-expanded="${cat==c}"><i class="dot" style="background:${CC[c]}"></i><span class="n">${c}</span><span>${fmt(by[c])}</span><span class="p">${Math.round(by[c]/tot*100)}%</span></button>`+(cat==c?`<div class="det"><div class="sub">${L.length} عملية · المتوسط ${fmt(by[c]/L.length)} د</div><div class="card">${L.map(x=>rowH(x,1)).join("")}</div></div>`:"")}).join("");
    const shown=all;
    const g={};shown.forEach(x=>(g[x.d]=g[x.d]||[]).push(x));
    h+=Object.keys(g).sort().reverse().map(d=>{
      const dt=pd(d),s=g[d].reduce((a,x)=>a+x.a,0);
      return `<div class="day"><h2><span>${DN[dt.getDay()]} ${dt.getDate()} ${MN[dt.getMonth()]}</span><span>${fmt(s)} د</span></h2><div class="card">${g[d].map(x=>rowH(x)).join("")}</div></div>`}).join("");
  }
  $("#app").innerHTML=h;$("#smt").textContent="المصاريف اليومية فقط (أقل من "+cfg.big+" د)";renderQuick();
}

function chips(){$("#chips").innerHTML=CATS.map(c=>`<button class="${pick==c[0]?"on":""}" data-a="pick" data-v="${c[0]}"><i class="dot" style="background:${c[1]}"></i>${c[0]}</button>`).join("")}

function persist(next){items=next;render();if(view)ov(view);try{localStorage.setItem("ledger",JSON.stringify(next))}catch(e){toast("تعذّر الحفظ على الجهاز")}}

function sel(){const t=new Date(),today=iso(t);let from="0000-00-00";if(range=="week"){const d=new Date(t);d.setDate(d.getDate()-6);from=iso(d)}if(range=="month")from=today.slice(0,8)+"01";let all=items.filter(x=>x.d>=from);if(small)all=all.filter(x=>x.a<cfg.big);return{all,today}}
const lbl=d=>{const t=pd(d);return t.getDate()+" "+MN[t.getMonth()]};
function chartsHTML(){
  const{all,today}=sel();
  const ctl=`<div class="seg">${[["week","7 أيام"],["month","هذا الشهر"],["all","الكل"]].map(r=>`<button class="${range==r[0]?"on":""}" data-a="range" data-v="${r[0]}">${r[1]}</button>`).join("")}</div><button class="pill" style="margin:10px 0" data-a="small">${small?"✓ ":""}المصاريف اليومية فقط</button>`;
  if(!all.length)return ctl+`<div class="empty">لا توجد بيانات في هذه الفترة</div>`;
  const tot=all.reduce((s,x)=>s+x.a,0),by={},dd={};
  all.forEach(x=>{by[x.c]=(by[x.c]||0)+x.a;dd[x.d]=(dd[x.d]||0)+x.a});
  const cats=CATS.map(c=>c[0]).filter(c=>by[c]).sort((a,b)=>by[b]-by[a]);
  let a=pd(Object.keys(dd).sort()[0]);const b=pd(today);
  if((b-a)/864e5>29){a=new Date(b);a.setDate(b.getDate()-29)}
  const ds=[];for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1))ds.push(iso(d));
  const mx=Math.max(...ds.map(d=>dd[d]||0),1),W=340,H=130,bw=W/ds.length;
  const bars=ds.map((d,i)=>{const v=dd[d]||0,h=v/mx*H,x=(ds.length-1-i)*bw;return `<g data-a="bar" data-v="${d}"><rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent"/><rect x="${x+1}" y="${H-h}" width="${Math.max(bw-2,1)}" height="${v?Math.max(h,2):0}" rx="2" fill="var(--ac)" opacity="${bar&&bar!=d?.35:1}"/></g>`}).join("");
  const top=ds.reduce((m,d)=>(dd[d]||0)>(dd[m]||0)?d:m,ds[0]);
  const cap=bar&&ds.includes(bar)?`${lbl(bar)}: ${fmt(dd[bar]||0)} د`:`أعلى يوم: ${lbl(top)} (${fmt(dd[top]||0)} د) · اضغط على عمود لرؤية قيمته`;
  const hint=!small&&all.some(x=>x.a>=cfg.big)?`<div class="sub">تلميح: فعّل «المصاريف اليومية فقط» لتظهر الفروق بين الأيام العادية.</div>`:"";
  let subH="";
  if(sub&&by[sub]){const g={};all.filter(x=>x.c==sub).forEach(x=>g[x.n]=(g[x.n]||0)+x.a);const ks=Object.keys(g).sort((p,q)=>g[q]-g[p]);const P=ks.slice(0,6).map((k,i)=>({n:k,v:g[k],c:CC[sub],o:1-i*.13}));const rest=ks.slice(6).reduce((q,k)=>q+g[k],0);if(rest>0)P.push({n:"أخرى",v:rest,c:CC[sub],o:.2});subH=`<h2 class="ch">تفاصيل «${esc(sub)}» · ${fmt(by[sub])} د</h2>`+donut(P,by[sub])}
  return ctl+hint+`<h2 class="ch">المصاريف اليومية</h2><div class="sub">${cap}</div><svg class="ct" viewBox="0 0 ${W} ${H+16}">${bars}<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="var(--line)"/><text x="${W}" y="${H+12}" text-anchor="end">${lbl(ds[0])}</text><text x="0" y="${H+12}">${lbl(ds[ds.length-1])}</text></svg><h2 class="ch">حسب الفئة (اضغط على فئة لتفصيلها)</h2>${donut(cats.map(c=>({n:c,v:by[c],c:CC[c],a:"sub"})),tot)}${subH}`;
}
function settingsHTML(){
  return `<div class="set"><label>المظهر</label><div class="seg">${[["auto","تلقائي"],["light","فاتح"],["dark","داكن"]].map(t=>`<button class="${cfg.theme==t[0]?"on":""}" data-a="theme" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>
<label>حدّ «المصروف الكبير» (بالدينار)</label><input id="big" inputmode="decimal" value="${cfg.big}">
<label>أول يوم في الأسبوع (الروزنامة)</label><div class="seg">${[[1,"الإثنين"],[6,"السبت"],[0,"الأحد"]].map(t=>`<button class="${cfg.ws==t[0]?"on":""}" data-a="ws" data-v="${t[0]}">${t[1]}</button>`).join("")}</div>
<label>البيانات (${items.length} مصروف على هذا الجهاز)</label>

function ov(v){view=v;const o=$("#ov");if(!v){o.style.display="none";return}$("#ovt").textContent={charts:"الرسوم البيانية",settings:"الإعدادات",calendar:"الروزنامة"}[v];$("#ovb").innerHTML=v=="charts"?chartsHTML():v=="settings"?settingsHTML():calHTML();o.style.display="block"}
function menu(id){const x=items.find(i=>i.id==id);if(!x)return;cur=id;menuT=Date.now();$("#mt").textContent=x.n+" · "+fmt(x.a)+" د";$("#mn").classList.add("open")}
function mclose(){$("#mn").classList.remove("open")}
document.addEventListener("pointerdown",e=>{const r=e.target.closest(".row[data-id]");if(!r)return;const id=r.dataset.id;lp={x:e.clientX,y:e.clientY,t:setTimeout(()=>{lp=null;if(navigator.vibrate)navigator.vibrate(15);menu(id)},450)}});
document.addEventListener("pointermove",e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>10){clearTimeout(lp.t);lp=null}});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>{if(lp){clearTimeout(lp.t);lp=null}}));
document.addEventListener("contextmenu",e=>{if(e.target.closest(".row[data-id]"))e.preventDefault()});
document.addEventListener("change",e=>{if(e.target.id=="big"){const v=num(e.target.value);if(v>0){cfg.big=v;saveCfg();render()}}});
function openSheet(id){
  editId=id||null;const x=editId&&items.find(i=>i.id==editId);
  if(x)pick=CC[x.c]?x.c:"أخرى";
  $("#amt").value=x?String(x.a):"";$("#nm").value=x?x.n:"";$("#dt").value=x?x.d:iso(new Date());
  chips();$("#sh").classList.add("open");fit();setTimeout(()=>$("#amt").focus(),50)}
function closeSheet(){$("#sh").classList.remove("open");if(document.activeElement)document.activeElement.blur()}
function fit(){const v=window.visualViewport,s=$("#sh");if(!v)return;s.style.top=v.offsetTop+"px";s.style.height=v.height+"px";s.style.bottom="auto"}
if(window.visualViewport){visualViewport.addEventListener("resize",fit);visualViewport.addEventListener("scroll",fit)}
$("#chips").addEventListener("pointerdown",e=>e.preventDefault());
$(".panel").addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();if(e.target.id=="amt")$("#nm").focus();else add()});
let Q=[];
function renderQuick(){
  const m={};
  items.forEach(x=>{const k=x.n+"|"+x.c,e=m[k]||(m[k]={n:x.n,c:x.c,k:0,a:0,d:""});e.k++;if(x.d>=e.d){e.d=x.d;e.a=x.a}});
  Q=Object.values(m).filter(e=>e.k>=2&&e.a<cfg.big).sort((p,q)=>q.k-p.k||(p.d<q.d?1:-1)).slice(0,8);
  $("#qk").innerHTML=Q.map((e,i)=>`<button data-a="q" data-v="${i}">${esc(e.n)} <b>${+e.a.toFixed(3)}</b></button>`).join("");
}

function add(){
  const a=num($("#amt").value);
  if(!(a>0)){$("#amt").focus();toast("اكتب المبلغ أولاً");return}
  const o={d:$("#dt").value||iso(new Date()),n:$("#nm").value.trim()||pick,c:pick,a:Math.round(a*1000)/1000};
  if(editId){const id=editId;persist(items.map(x=>x.id==id?{...x,...o}:x));toast("تم التعديل")}
  else{persist([...items,{id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),...o}]);toast("تمت الإضافة")}
  closeSheet();
}

function dl(name,type,data){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function exp(){
  const rows=["التاريخ,البيان,الفئة,المبلغ",...items.slice().sort((x,y)=>x.d<y.d?-1:1).map(x=>[x.d,'"'+x.n.replace(/"/g,'""')+'"',x.c,x.a].join(","))];
  dl("masarifi.csv","text/csv;charset=utf-8","\ufeff"+rows.join("\n"));
}
function backup(){dl("masarifi-backup-"+iso(new Date())+".json","application/json",JSON.stringify({items}))}
$("#rf").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw 0;
    persist(d.items.filter(x=>x&&typeof x.id=="string"&&typeof x.d=="string"&&typeof x.a=="number").map(x=>({id:x.id,d:x.d,n:String(x.n||""),c:String(x.c||"أخرى"),a:x.a})));
    toast("تمت استعادة النسخة الاحتياطية");
  }catch(_){toast("الملف غير صالح")}
});

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;if(Date.now()-menuT<250)return;
  if(a=="range"){range=v;render()}
  else if(a=="cat"){cat=cat==v?null:v;render()}
  else if(a=="open")openSheet();
  else if(a=="close")closeSheet();
  else if(a=="pick"){pick=v;chips()}
  else if(a=="q"){const e=Q[v];if(!e)return;const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);persist([...items,{id,d:iso(new Date()),n:e.n,c:e.c,a:e.a}]);toast("أضيف "+e.n+" "+(+e.a.toFixed(3))+" د",()=>persist(items.filter(x=>x.id!=id)))}
  else if(a=="save")add();
  else if(a=="export")exp();else if(a=="backup")backup();else if(a=="restore")$("#rf").click();
  else if(a=="charts"||a=="settings"||a=="calendar"){if(a=="calendar"){cmo=0;calSel=iso(new Date())}ov(a)}
  else if(a=="day"){calSel=v;ov(view);const e=$("#cdet");if(e)e.scrollIntoView({behavior:"smooth",block:"nearest"})}
  else if(a=="cmo"){cmo+=+v;calSel=null}
  else if(a=="addday"){openSheet();$("#dt").value=v}
  else if(a=="sub")sub=sub==v?null:v;
  else if(a=="ws"){cfg.ws=+v;saveCfg()}
  else if(a=="xlsx"){if(!items.length)toast("لا توجد بيانات للتصدير");else{try{dl("masarifi.xlsx","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",buildXlsx());toast("تم إنشاء ملف Excel")}catch(e){toast("تعذّر إنشاء الملف")}}}
  else if(a=="ovx")ov(null);
  else if(a=="bar")bar=bar==v?null:v;
  else if(a=="small"){small=!small;$("#sm").checked=small;render()}
  else if(a=="theme"){cfg.theme=v;saveCfg();theme()}
  else if(a=="wipe"){if(wipe){wipe=false;persist([])}else{wipe=true;setTimeout(()=>{wipe=false;if(view=="settings")ov(view)},4000)}}
  else if(a=="medit"){mclose();openSheet(cur)}
  else if(a=="mdel"){const x=items.find(i=>i.id==cur);mclose();if(x){persist(items.filter(i=>i.id!=x.id));toast("حُذف "+x.n,()=>persist([...items,x]))}}
  else if(a=="mclose")mclose();
  if(view&&a!="day")ov(view);
});
$("#sm").addEventListener("change",e=>{small=e.target.checked;render()});

const SEED=[];
function init(){theme();
  let raw=null;try{raw=localStorage.getItem("ledger")}catch(e){}
  try{items=raw===null?SEED:JSON.parse(raw)}catch(e){items=[]}
  if(raw===null){try{localStorage.setItem("ledger",JSON.stringify(items))}catch(e){}}
  loaded=true;render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
init();
</script>
</body>
</html>
